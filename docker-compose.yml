version: '3.7'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/ssl
    depends_on:
      - was1
      - was2
      - was3
    networks:
      - kafkaNet
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - kafkaNet
  was1:
    build: .
    container_name: was1
    ports:
      - "8081:8081"
    networks:
      - kafkaNet
    environment:
      - SPRING_PROFILES_ACTIVE=was1
  was2:
    build: .
    container_name: was2
    ports:
      - "8082:8082"
    networks:
      - kafkaNet
    environment:
      - SPRING_PROFILES_ACTIVE=was2
  was3:
    build: /Users/parkjw/Desktop/study/demo
    container_name: was3
    environment:
      - SPRING_PROFILES_ACTIVE=was3
    ports:
      - "8083:8083"
    networks:
      - kafkaNet



networks:
  kafkaNet:
    driver: bridge

